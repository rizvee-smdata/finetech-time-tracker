name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.8.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: rizvee
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            whoami
            hostname

            cd /path/to/your/project

            git pull origin main

            docker compose down
            docker compose build
            docker compose up -d

            docker ps
