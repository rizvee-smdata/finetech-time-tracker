name: Debug SSH Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check environment
        run: |
          echo "Runner:"
          uname -a

          echo "Current directory:"
          pwd

          echo "Files:"
          ls -la

      - name: Check GCP secrets
        run: |
          if [ -z "${{ secrets.GCP_HOST }}" ]; then
            echo "❌ GCP_HOST missing"
          else
            echo "✅ GCP_HOST exists"
          fi

          if [ -z "${{ secrets.GCP_USERNAME }}" ]; then
            echo "❌ GCP_USERNAME missing"
          else
            echo "✅ GCP_USERNAME exists"
          fi

          if [ -z "${{ secrets.GCP_SSH_KEY }}" ]; then
            echo "❌ GCP_SSH_KEY missing"
          else
            echo "✅ GCP_SSH_KEY exists"
          fi

      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.GCP_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -vvv \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }} \
            '
            echo "=========================="
            echo "SSH Connected Successfully"
            echo "=========================="

            echo "Hostname:"
            hostname

            echo "Current User:"
            whoami

            echo "Uptime:"
            uptime

            echo "Docker:"
            docker --version || echo "Docker not installed"

            echo "Running Containers:"
            docker ps || true

            echo "Done."
            '
